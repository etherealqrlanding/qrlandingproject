services:
  postgres:
    image: postgres:16-alpine
    container_name: tangoqr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tangoqr
      POSTGRES_PASSWORD: tangoqr
      POSTGRES_DB: tangoqr
    ports:
      - "5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tangoqr -d tangoqr"]
      interval: 5s
      timeout: 5s
      retries: 10
